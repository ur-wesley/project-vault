[package]
name = "project-vault"
version = "0.10.6"
description = "Steam for dev Projects!"
authors = ["Wesley"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "project_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard = "2.1.11"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-cli = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
toml_edit = "0.22"
dunce = "1"
walkdir = "2"
glob = "0.3"
ignore = "0.4"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", default-features = false, features = ["time", "sync", "rt", "process"] }
async-trait = "0.1"
dotenvy = "0.15.7"
tantivy = "0.22"
regex = "1"
once_cell = "1"
thiserror = "1"
notify = "6.1"
tempfile = "3"
shell-words = "1"
mlua = { version = "0.10.2", features = ["luau", "serialize", "async"] }
zstd-sys = "=2.0.9"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3.4"
enigo = "0.3"
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
portable-pty = "0.9"
base64 = "0.22"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
window-vibrancy = "0.6"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
tauri-winrt-notification = "0.7"
windows-registry = "0.5"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Ole",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
freedesktop-desktop-entry = { version = "0.8", default-features = false }
